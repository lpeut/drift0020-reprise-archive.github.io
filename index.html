    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDlA3bj9l2kESMnn8GfvU60qGWX-AVRyi8",
            authDomain: "drift0020-reprise.firebaseapp.com",
            projectId: "drift0020-reprise",
            storageBucket: "drift0020-reprise.firebasestorage.app",
            messagingSenderId: "1041258745589",
            appId: "1:1041258745589:web:960376ebd030f330993fbc",
            measurementId: "G-LE6ZX7TZP7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.handleGoogleLogin = async function() {
            try {
                const result = await signInWithPopup(auth, provider);
                const email = result.user.email;

                const docRef = doc(db, "allowed_emails", email);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    await signOut(auth);
                    elements.authError.innerText = "허용되지 않은 이메일입니다.";
                    elements.authError.classList.remove('hidden');
                } else {
                    const configDoc = await getDoc(doc(db, "settings", "config"));
                    const fetchedPassword = configDoc.exists() ? configDoc.data().masterPassword : null;
                    
                    if (!fetchedPassword) {
                        console.error("복호화 키를 찾을 수 없습니다.");
                        elements.authError.innerText = "복호화 설정 오류.";
                        elements.authError.classList.remove('hidden');
                        return;
                    }

                    currentMasterPassword = fetchedPassword;
                    elements.loginOverlay.classList.add('hidden');
                    autoLoadData(fetchedPassword); 
                }
            } catch (err) {
                console.error("Login Error:", err);
                elements.authError.innerText = "로그인 실패: " + err.message;
                elements.authError.classList.remove('hidden');
            }
        };

        window.firebaseLogout = async () => {
            await signOut(auth);
            location.reload();
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const docRef = doc(db, "allowed_emails", user.email);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const configDoc = await getDoc(doc(db, "settings", "config"));
                        currentMasterPassword = configDoc.exists() ? configDoc.data().masterPassword : null;
                        elements.loginOverlay.classList.add('hidden');
                        await autoLoadData(currentMasterPassword);
                    } else {
                        await signOut(auth);
                        document.getElementById('loadingOverlay').classList.add('hidden');
                    }
                } catch (err) {
                    console.error("Auth state check error:", err);
                    document.getElementById('loadingOverlay').classList.add('hidden');
                }
            } else {
                document.getElementById('loadingOverlay').classList.add('hidden');
                elements.loginOverlay.classList.remove('hidden');
                elements.app.classList.add('hidden');
            }
        });
    </script>

    <script>
        let allData = { users: [], statuses: [] };
        let filteredStatuses = [];
        let displayedCount = 0;
        const PAGE_SIZE = 50;
        let selectedUserId = null;
        let searchTerm = '';
        let currentObserver = null; 
        let currentMasterPassword = null;

        const statusMap = new Map();
        const replyMap = new Map();
        const avatarCache = new Map();

        const elements = {
            loginOverlay: document.getElementById('loginOverlay'),
            authTitle: document.getElementById('authTitle'),
            loginForm: document.getElementById('loginForm'),
            signupForm: document.getElementById('signupForm'),
            authError: document.getElementById('authError'),
            loginId: document.getElementById('loginId'), loginPw: document.getElementById('loginPw'),
            signupId: document.getElementById('signupId'), signupPw: document.getElementById('signupPw'), signupInvite: document.getElementById('signupInvite'),
            userList: document.getElementById('userList'), timeline: document.getElementById('timeline'),
            statusContainer: document.getElementById('statusContainer'), themeToggle: document.getElementById('themeToggle'),
            statusSearch: document.getElementById('statusSearch'), userSearch: document.getElementById('userSearch'),
            sentinel: document.getElementById('sentinel'), app: document.getElementById('app'),
            threadModal: document.getElementById('threadModal'), modalContent: document.getElementById('modalContent')
        };

        // ── 드래그 감지: mousedown 위치를 저장해두고 click 시점에 비교 ──
        let _mouseDownX = 0;
        let _mouseDownY = 0;
        document.addEventListener('mousedown', e => {
            _mouseDownX = e.clientX;
            _mouseDownY = e.clientY;
        });
        // ────────────────────────────────────────────────────────────────

        window.addEventListener('DOMContentLoaded', async () => {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');

        });

        function toggleAuthMode(isSignup) {
            elements.authError.classList.add('hidden');
            if (isSignup) {
                elements.authTitle.innerText = "Create Account";
                elements.loginForm.classList.add('hidden');
                elements.signupForm.classList.remove('hidden');
            } else {
                elements.authTitle.innerText = "Drift 0020 *reprise Archive";
                elements.loginForm.classList.remove('hidden');
                elements.signupForm.classList.add('hidden');
            }
        }

        async function handleManualLogin() {
            const id = elements.loginId.value.trim();
            const pw = elements.loginPw.value.trim();
            if (!id || !pw) return;
            const res = await window.firebaseLogin(id, pw);
            if (res.success) {
                currentMasterPassword = res.masterPassword;
                elements.loginOverlay.classList.add('hidden');
                autoLoadData();
            } else {
                elements.authError.innerText = res.message;
                elements.authError.classList.remove('hidden');
            }
        }

        async function handleManualSignup() {
            const id = elements.signupId.value.trim();
            const pw = elements.signupPw.value.trim();
            const invite = elements.signupInvite.value.trim();
            if (!id || !pw || !invite) return;
            const res = await window.firebaseSignup(id, pw, invite);
            if (res.success) {
                alert("가입 성공! 이제 방금 만든 계정으로 로그인해 주세요.");
                toggleAuthMode(false);
            } else {
                elements.authError.innerText = res.message;
                elements.authError.classList.remove('hidden');
            }
        }

        window.autoLoadData = async function(password) {
            const pwd = password || currentMasterPassword;
            if (!pwd) { console.error("복호화 키가 없습니다."); return; }
            try {
                const fetchOptions = { cache: 'no-store' };
                const base = new URL('./', window.location.href).href;
                const response1 = await fetch(base + 'scripts/data_part1.enc?t=' + Date.now(), fetchOptions);
                const response2 = await fetch(base + 'scripts/data_part2.enc?t=' + Date.now(), fetchOptions);
                if (!response1.ok || !response2.ok) {
                    console.error("파일 로드 상태:", response1.status, response2.status);
                    throw new Error("data_part 파일을 찾을 수 없습니다.");
                }
                const blob1 = await response1.blob();
                const blob2 = await response2.blob();
                const combinedBlob = new Blob([blob1, blob2]);
                const combinedBuffer = await combinedBlob.arrayBuffer();
                const decryptedBuffer = await decryptMainData(combinedBuffer, pwd);
                const blob = new Blob([decryptedBuffer]);
                const ds = new DecompressionStream('deflate');
                const stream = blob.stream().pipeThrough(ds);
                const decompressedBuffer = await new Response(stream).arrayBuffer();
                const decryptedText = new TextDecoder().decode(decompressedBuffer);
                allData = JSON.parse(decryptedText);
                buildThreadIndex(allData.statuses);
                document.getElementById('loadingOverlay').classList.add('hidden');
                elements.app.classList.remove('hidden');
                applyFilters();
                renderUserList();
            } catch (err) {
                console.error("Data Load/Decrypt Error:", err);
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        };

        async function decryptMainData(buffer, password) {
            const encoder = new TextEncoder();
            const keyData = await crypto.subtle.digest('SHA-256', encoder.encode(password));
            const cryptoKey = await crypto.subtle.importKey('raw', keyData, { name: 'AES-GCM' }, false, ['decrypt']);
            const nonce = buffer.slice(0, 16);
            const tag = buffer.slice(16, 32);
            const ciphertext = buffer.slice(32);
            const combined = new Uint8Array(ciphertext.byteLength + tag.byteLength);
            combined.set(new Uint8Array(ciphertext), 0);
            combined.set(new Uint8Array(tag), ciphertext.byteLength);
            try {
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: nonce, tagLength: 128 },
                    cryptoKey,
                    combined
                );
                return new Uint8Array(decrypted);
            } catch (e) {
                console.error("복호화 상세 오류:", e);
                throw e;
            }
        }

        function buildThreadIndex(statuses) {
            statusMap.clear(); replyMap.clear();
            statuses.forEach(s => {
                if (!s || s.id === undefined) return;
                const nid = String(s.id).trim(); statusMap.set(nid, s);
                const pid = s.in_reply_to_id || s.reply_to || (s.status && s.status.in_reply_to_id);
                if (pid) {
                    const npid = String(pid).trim();
                    if (!replyMap.has(npid)) replyMap.set(npid, []);
                    replyMap.get(npid).push(s);
                }
            });
        }

        function applyFilters() {
            if (currentObserver) { currentObserver.unobserve(elements.sentinel); currentObserver = null; }
            const f = parseSearch(searchTerm);
            filteredStatuses = allData.statuses.filter(s => {
                if (selectedUserId && s.user_id !== selectedUserId) return false;
                if (f.from && s.user?.username.toLowerCase() !== f.from) return false;
                if (f.since && new Date(s.created_at) < f.since) return false;
                if (f.until && new Date(s.created_at) > f.until) return false;
                if (f.qArray.length > 0) {
                    const content = s.content.toLowerCase();
                    for (const word of f.qArray) { if (!content.includes(word)) return false; }
                }
                return true;
            });
            displayedCount = 0; elements.statusContainer.innerHTML = ''; elements.timeline.scrollTo({ top: 0 });
            loadMore(); bindNewObserver();
        }

        function parseSearch(text) {
            const f = { from: null, since: null, until: null, qArray: [] };
            let query = text;
            const mFrom = text.match(/from:(\S+)/i); 
            if (mFrom) { f.from = mFrom[1].replace('@','').toLowerCase(); query = query.replace(mFrom[0], ''); }
            const mSince = text.match(/since:(\d{4}-\d{2}-\d{2})/i); 
            if (mSince) { f.since = new Date(mSince[1]); query = query.replace(mSince[0], ''); }
            const mUntil = text.match(/until:(\d{4}-\d{2}-\d{2})/i); 
            if (mUntil) { f.until = new Date(mUntil[1]); query = query.replace(mUntil[0], ''); }
            f.qArray = query.trim().toLowerCase().split(/\s+/).filter(word => word.length > 0);
            return f;
        }

        function bindNewObserver() {
            currentObserver = new IntersectionObserver(entries => { if (entries[0].isIntersecting) loadMore(); }, { root: elements.timeline, threshold: 0.1 });
            currentObserver.observe(elements.sentinel);
        }

        function renderUserList(filter = '') {
            const query = filter.toLowerCase();
            const users = allData.users.filter(u => u.username.toLowerCase().includes(query) || u.display_name.toLowerCase().includes(query));
            elements.userList.innerHTML = users.map(u => {
                const avatarPath = u.local_avatar_path || ''; const isEncrypted = avatarPath.endsWith('.enc');
                const avatarAttr = isEncrypted ? `data-encrypted-src="${avatarPath}" class="avatar-sm object-cover encrypted-media"` : `src="${avatarPath}" class="avatar-sm object-cover"`;
                return `
                <div onclick="filterByUser('${u.id}')" class="sidebar-item ${selectedUserId === u.id ? 'active' : ''}">
                    <img ${avatarAttr} onerror="this.src='https://via.placeholder.com/36'">
                    <div class="min-w-0">
                        <div class="font-bold text-sm text-gray-800 dark:text-gray-100 truncate">${u.display_name || u.username}</div>
                        <div class="text-xs text-gray-500 truncate">@${u.username}</div>
                    </div>
                </div>
            `;}).join('');
            observeEncryptedMedia();
        }

        function filterByUser(id) { selectedUserId = (selectedUserId === id) ? null : id; renderUserList(elements.userSearch.value); applyFilters(); }
        function goHome() { searchTerm = ''; selectedUserId = null; elements.statusSearch.value = ''; elements.userSearch.value = ''; renderUserList(); applyFilters(); }

        function createStatusHtml(s, isModalContext = false, isTarget = false) {
            const date = new Date(s.created_at);
            const dateStr = `${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일 ${date.getHours()}:${date.getMinutes().toString().padStart(2,'0')}`;
            const mediaHtml = (s.media_paths || []).map(p => {
                const ext = p.split('.').pop().toLowerCase(); const isEncrypted = p.endsWith('.enc');
                if (['mp4','webm','mov'].includes(ext) || (isEncrypted && p.includes('.mp4.enc'))) {
                    return `<video ${isEncrypted ? `data-encrypted-src="${p}"` : `src="${p}"`} controls class="media-item ${isEncrypted ? 'encrypted-media' : ''}" onclick="event.stopPropagation()"></video>`;
                } else {
                    return `<img ${isEncrypted ? `data-encrypted-src="${p}"` : `src="${p}"`} class="media-item cursor-zoom-in ${isEncrypted ? 'encrypted-media' : ''}" onclick="event.stopPropagation(); openLightbox(this)">`;
                }
            }).join('');
            const avatarPath = s.user?.local_avatar_path || ''; const isAvatarEncrypted = avatarPath.endsWith('.enc');
            
            const borderStyle = 'border-b border-borderPrimary dark:border-darkBorder bg-white dark:bg-darkCard';
            const paddingStyle = 'p-4';

            // isTarget: 모달에서 클릭된 원본 툿 표시용 data 속성
            const targetAttr = isTarget ? ' data-modal-target="true"' : '';

            return `
                <div ${!isModalContext ? `id="status-${s.id}"` : ''}${targetAttr} class="status-card ${borderStyle} ${paddingStyle}" onclick="handleStatusClick(event, '${s.id}')">
                    <img ${isAvatarEncrypted ? `data-encrypted-src="${avatarPath}"` : `src="${avatarPath}"`} class="avatar-circle flex-shrink-0 ${isAvatarEncrypted ? 'encrypted-media' : ''}" onerror="this.src='https://via.placeholder.com/48'">
                    <div class="flex-1 min-w-0 z-10">
                        <div class="flex items-baseline justify-between">
                            <div class="flex items-center gap-1 truncate"><span class="display-name truncate">${s.user?.display_name || s.user?.username}</span><span class="username truncate">@${s.user?.username}</span></div>
                            <span class="timestamp whitespace-nowrap">${dateStr}</span>
                        </div>
                        <div class="mt-1">
                            ${s.spoiler_text ? `<div class="cw-fixed-label">CW: ${s.spoiler_text}</div>` : ''}
                            <div class="status-content">${s.content}</div>${mediaHtml}
                        </div>
                        <div class="mt-3 flex gap-4 text-xs text-gray-500 font-bold justify-end" onclick="event.stopPropagation()">
                            <a href="${s.url}" target="_blank" class="hover:text-theseusGold"><i class="fa-solid fa-link mr-1"></i>원본</a>
                            ${(!isModalContext && (searchTerm || selectedUserId)) ? `<button onclick="event.stopPropagation(); jumpTo('${s.id}')" class="hover:text-theseusGold"><i class="fa-solid fa-eye mr-1"></i>타임라인 이동</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // ── 드래그 블록선택 vs 순수 클릭 구분 ──────────────────────────────
        function handleStatusClick(event, statusId) {
            // 1) 선택된 텍스트가 있으면(드래그로 블록선택) 모달 무시
            const sel = window.getSelection();
            if (sel && sel.toString().length > 0) return;

            // 2) mousedown ~ click 사이 커서 이동거리가 5px 초과면 드래그로 간주
            const dx = event.clientX - _mouseDownX;
            const dy = event.clientY - _mouseDownY;
            if (Math.sqrt(dx * dx + dy * dy) > 5) return;

            openThreadModal(event, statusId);
        }
        // ────────────────────────────────────────────────────────────────

        const decryptionObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const el = entry.target; const path = el.getAttribute('data-encrypted-src');
                    if (path) { decryptAndShow(el, path); decryptionObserver.unobserve(el); }
                }
            });
        }, { rootMargin: '200px' });

        async function decryptAndShow(el, path) {
            if (el.src && el.src.startsWith('blob:')) return;
            if (!el.classList.contains('encrypted-media')) return;
            if (avatarCache.has(path)) {
                el.src = avatarCache.get(path);
                el.classList.remove('encrypted-media');
                el.removeAttribute('data-encrypted-src');
                return;
            }
            const base = new URL('./', window.location.href).href;
            const absolutePath = path.startsWith('http') ? path : base + path;
            try {
                const response = await fetch(absolutePath);
                if (!response.ok) throw new Error("파일 로드 실패: " + response.status);
                const buffer = await response.arrayBuffer();
                const decryptedBuffer = await decryptMainData(buffer, currentMasterPassword);
                const blobUrl = URL.createObjectURL(new Blob([decryptedBuffer]));
                avatarCache.set(path, blobUrl);
                el.src = blobUrl; 
                el.classList.remove('encrypted-media'); 
                el.removeAttribute('data-encrypted-src');
            } catch (err) { 
                console.error("미디어 복호화 오류 (" + absolutePath + "):", err); 
                el.style.opacity = '0.5'; 
                el.title = "복호화 실패: " + err.message;
            }
        }

        function observeEncryptedMedia() { document.querySelectorAll('.encrypted-media').forEach(el => decryptionObserver.observe(el)); }

        function loadMore() {
            const batch = filteredStatuses.slice(displayedCount, displayedCount + PAGE_SIZE); if (batch.length === 0) return;
            const fragment = document.createDocumentFragment();
            batch.forEach(s => { const wrapper = document.createElement('div'); wrapper.innerHTML = createStatusHtml(s, false, false); fragment.appendChild(wrapper.firstElementChild); });
            elements.statusContainer.appendChild(fragment); displayedCount += batch.length; observeEncryptedMedia();
        }

        function openThreadModal(event, statusId) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            const nid = String(statusId).trim();
            const targetStatus = statusMap.get(nid);
            if (!targetStatus) return;

            elements.modalContent.innerHTML = '';
            const parents = [];
            let cpid = targetStatus.in_reply_to_id || targetStatus.reply_to || (targetStatus.status && targetStatus.status.in_reply_to_id);
            const visited = new Set([nid]);

            while (cpid) {
                const ncpid = String(cpid).trim();
                if (visited.has(ncpid)) break;
                visited.add(ncpid);
                const ps = statusMap.get(ncpid);
                if (ps) { parents.unshift(ps); cpid = ps.in_reply_to_id || ps.reply_to || (ps.status && ps.status.in_reply_to_id); }
                else break;
            }

            const descendants = [];
            function findD(tid) {
                const children = replyMap.get(String(tid).trim()) || [];
                children.forEach(c => {
                    if (!visited.has(String(c.id))) {
                        visited.add(String(c.id));
                        descendants.push(c);
                        findD(c.id);
                    }
                });
            }
            findD(nid);
            descendants.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            elements.modalContent.innerHTML =
                parents.map(p => createStatusHtml(p, true, false)).join('') +
                createStatusHtml(targetStatus, true, true) +
                descendants.map(d => createStatusHtml(d, true, false)).join('');

            elements.threadModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            observeEncryptedMedia();

            // 클릭한 툿(data-modal-target="true")이 모달 스크롤 영역 맨 위에 오도록
            setTimeout(() => {
                const targetEl = elements.modalContent.querySelector('[data-modal-target="true"]');
                if (targetEl) {
                    targetEl.scrollIntoView({ behavior: 'instant', block: 'start' });
                    // 위쪽에 약간의 여백(12px)을 추가
                    elements.modalContent.scrollTop = Math.max(0, elements.modalContent.scrollTop - 12);
                }
            }, 60);
        }

        // ── 모달 리사이즈 ─────────────────────────────────────────────
        (function() {
            const box = document.getElementById('threadModalBox');
            let resizing = false, dir = '', startX, startY, startW, startH, startL, startT;

            box.querySelectorAll('.resize-handle').forEach(handle => {
                handle.addEventListener('mousedown', e => {
                    e.preventDefault(); e.stopPropagation();
                    resizing = true;
                    dir = [...handle.classList].find(c => c.startsWith('resize-') && c !== 'resize-handle').replace('resize-','');
                    startX = e.clientX; startY = e.clientY;
                    const r = box.getBoundingClientRect();
                    startW = r.width; startH = r.height;
                    startL = r.left; startT = r.top;
                    // px 고정
                    box.style.width = startW + 'px';
                    box.style.height = startH + 'px';
                    box.style.margin = '0';
                    box.style.position = 'absolute';
                    box.style.left = startL + 'px';
                    box.style.top  = startT + 'px';
                    document.body.style.userSelect = 'none';
                });
            });

            document.addEventListener('mousemove', e => {
                if (!resizing) return;
                const dx = e.clientX - startX, dy = e.clientY - startY;
                const minW = 320, minH = 200;
                const maxW = window.innerWidth  - 16;
                const maxH = window.innerHeight - 16;

                let w = startW, h = startH, l = startL, t = startT;

                if (dir.includes('e')) w = Math.min(maxW, Math.max(minW, startW + dx));
                if (dir.includes('s')) h = Math.min(maxH, Math.max(minH, startH + dy));
                if (dir.includes('w')) { w = Math.min(maxW, Math.max(minW, startW - dx)); l = startL + (startW - w); }
                if (dir.includes('n')) { h = Math.min(maxH, Math.max(minH, startH - dy)); t = startT + (startH - h); }

                box.style.width  = w + 'px';
                box.style.height = h + 'px';
                box.style.left   = l + 'px';
                box.style.top    = t + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (resizing) { resizing = false; document.body.style.userSelect = ''; }
            });
        })();
        // ────────────────────────────────────────────────────────────────

        function closeThreadModal() { 
            elements.threadModal.classList.add('hidden'); 
            document.body.style.overflow = '';
            // 모달 크기/위치 초기화
            const box = document.getElementById('threadModalBox');
            box.style.position = '';
            box.style.left = '';
            box.style.top = '';
            box.style.margin = '';
            box.style.width = '672px';
            box.style.height = '85vh';
        }

        function openLightbox(imgEl) {
            const src = imgEl.src;
            if (!src || src.startsWith('data:') === false && !src.startsWith('blob:') && !src.startsWith('http')) return;
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightboxImg');
            lbImg.src = src;
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.remove('open');
            document.getElementById('lightboxImg').src = '';
            document.body.style.overflow = '';
        }

        // ESC 키로 라이트박스 닫기
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeLightbox();
                closeThreadModal();
            }
        });

        async function jumpTo(id) {
            searchTerm = '';
            selectedUserId = null;
            elements.statusSearch.value = '';
            elements.userSearch.value = '';
            document.getElementById('loadingOverlay').classList.remove('hidden');
            setTimeout(() => {
                applyFilters();
                const targetId = String(id).trim();
                let idx = filteredStatuses.findIndex(s => String(s.id).trim() === targetId);
                if (idx === -1) {
                    alert("타임라인에서 해당 툿을 찾을 수 없습니다.");
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    return;
                }
                elements.statusContainer.innerHTML = '';
                displayedCount = 0;
                while (displayedCount <= idx) {
                    const end = Math.min(displayedCount + PAGE_SIZE, filteredStatuses.length);
                    const batch = filteredStatuses.slice(displayedCount, end);
                    const fragment = document.createDocumentFragment();
                    batch.forEach(s => {
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = createStatusHtml(s, false, false);
                        fragment.appendChild(wrapper.firstElementChild);
                    });
                    elements.statusContainer.appendChild(fragment);
                    displayedCount = end;
                    if (displayedCount >= filteredStatuses.length) break;
                }
                renderUserList();
                observeEncryptedMedia();
                const el = document.getElementById(`status-${targetId}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'auto', block: 'center' });
                    el.classList.add('bg-yellow-100', 'dark:bg-yellow-900');
                    setTimeout(() => el.classList.remove('bg-yellow-100', 'dark:bg-yellow-900'), 2000);
                }
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 50);
        }

        elements.statusSearch.addEventListener('keydown', e => { if (e.key === 'Enter') { searchTerm = e.target.value; applyFilters(); } });
        elements.userSearch.addEventListener('input', e => renderUserList(e.target.value));
        elements.themeToggle.addEventListener('click', () => { document.documentElement.classList.toggle('dark'); localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light'; });
    </script>
</body>
</html>
